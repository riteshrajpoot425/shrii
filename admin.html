<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shri Automobile Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<section id="loginSection" class="login-section">
  <div class="login-card">
    <div class="login-logo">🚗</div>
    <h1>Shri Automobile</h1>
    <p>Admin Dashboard</p>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="Admin email" required>
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit" id="loginButton">Login</button>
    </form>
    <div id="loginMessage" class="message"></div>
    <a href="/" class="back-link">← Back to website</a>
  </div>
</section>

<section id="dashboardSection" class="dashboard" style="display:none;">
  <header class="admin-header">
    <div><h1>Shri Automobile</h1><span>Admin Dashboard</span></div>
    <div class="header-actions">
      <button id="refreshButton">↻ Refresh</button>
      <button id="logoutButton" class="logout">Logout</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="stats-grid">
      <div class="stat-card"><span>Total Bookings</span><strong id="totalBookings">0</strong></div>
      <div class="stat-card pending"><span>Pending</span><strong id="pendingBookings">0</strong></div>
      <div class="stat-card confirmed"><span>Confirmed</span><strong id="confirmedBookings">0</strong></div>
      <div class="stat-card completed"><span>Completed</span><strong id="completedBookings">0</strong></div>
    </div>

    <section class="admin-card">
      <div class="card-heading"><h2>Service Bookings</h2><p>Manage customer service requests.</p></div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Customer</th><th>Vehicle</th><th>Service</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="bookingsTable"></tbody>
        </table>
      </div>
    </section>

    <section class="admin-card">
      <div class="card-heading"><h2>Contact Messages</h2><p>Messages submitted through the website.</p></div>
      <div id="messagesContainer" class="messages-container"></div>
    </section>
  </main>
</section>

<div id="adminToast" class="admin-toast"></div>
<script src="admin.js"></script>
</body>
</html>
